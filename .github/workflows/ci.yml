name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The jobs only read the repository; nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  skate-installer:
    name: Skate plugin source installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ubuntu:24.04
    steps:
      - name: Install source-check tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl coreutils passwd util-linux python3 shellcheck git
      - uses: actions/checkout@v4
      - name: Installer syntax and shell checks
        run: |
          bash -n mods/rust/server/add-skate.sh
          shellcheck mods/rust/server/add-skate.sh
      - name: Approved source-installation scenario
        run: python3 crates/approved_tests/skate/SkateServerPluginInstallScenario.py

  gates:
    name: Publish and asset gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
      - name: Asset check
        run: python3 scripts/check_assets.py
      - name: Publish check
        run: cargo run -q -p xtask --locked -- publish-check
      - name: rustfmt on changed files
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base revision to compare against; skipping"
            exit 0
          fi
          scripts/check_fmt_changed.sh "$BASE"

  # No debuginfo: with it the workspace's test build passes 25 GB of target/.
  build:
    name: Check and test
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Bevy system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked

  # Blocking per package: scripts/clippy_gate.py fails only on findings in a
  # package listed in scripts/clippy_clean.txt; the rest of the imported code
  # (about 1,300 findings) is reported, not enforced. --cap-lints keeps every
  # crate linted instead of stopping at the first deny-level finding. The
  # toolchain is pinned so a new clippy lint cannot fail a package that did
  # not change; bump it on purpose and fix or delist what it flags.
  clippy:
    name: Clippy (blocking for clean packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Bevy system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: cargo clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --message-format=json -- --cap-lints warn \
            | python3 scripts/clippy_gate.py | tee clippy.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### Clippy"
            echo '```'
            sed -n '/^clippy: /,$p' clippy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
